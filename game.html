<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Galaga Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #030308;
            color: #fff;
            user-select: none;
            touch-action: manipulation;
        }
        .neon-text-red { text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; }
        .neon-text-blue { text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff; }
        .neon-text-yellow { text-shadow: 0 0 10px #ffee00, 0 0 20px #ffee00; }
        .arcade-border {
            border: 4px solid #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5), inset 0 0 15px rgba(59, 130, 246, 0.3);
        }
        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 md:p-4 overflow-hidden">

    <div class="relative flex flex-col items-center w-full max-w-4xl arcade-border bg-black rounded-xl p-3 md:p-5 my-auto">

        <!-- Back to profile -->
        <a href="index.html" class="absolute top-2 left-3 text-[10px] md:text-xs text-cyan-400 hover:text-cyan-200 z-30">&larr; 프로필로</a>

        <!-- Header / Scoreboard -->
        <div class="w-full flex justify-between items-center mb-3 text-xs md:text-sm px-2 border-b-2 border-gray-800 pb-2 mt-4">
            <div>
                <span class="text-gray-400">SCORE:</span>
                <span id="score" class="text-yellow-400 font-bold ml-1">00000</span>
            </div>
            <div>
                <span class="text-gray-400">STAGE:</span>
                <span id="stage" class="text-cyan-400 font-bold ml-1">1</span>
            </div>
            <div>
                <span class="text-gray-400">HIGH:</span>
                <span id="high-score" class="text-red-500 font-bold ml-1">05000</span>
            </div>
            <div>
                <span class="text-gray-400">LIVES:</span>
                <span id="lives" class="text-green-400 font-bold ml-1">❤️❤️❤️</span>
            </div>
        </div>

        <!-- Weapon & Status Bar -->
        <div class="w-full flex justify-between items-center mb-2 px-2 text-[10px] md:text-xs">
            <div id="weapon-display" class="neon-text-blue text-cyan-300">WEAPON: BASIC CANNON</div>
            <div id="power-timer" class="text-yellow-300 hidden">ULTRA TIME: <span id="timer-sec">10</span>s</div>
        </div>

        <!-- Main Canvas Frame -->
        <div class="relative w-full aspect-[4/3] max-h-[65vh] bg-black rounded overflow-hidden flex justify-center items-center">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- Overlay Screen (Start / Game Over / Stage Cleared) -->
            <div id="overlay" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center z-20 text-center p-4">
                <h1 id="overlay-title" class="text-2xl md:text-4xl text-red-500 neon-text-red mb-4 animate-pulse">GALAGA ULTRA</h1>
                <p id="overlay-msg" class="text-xs md:text-sm text-cyan-300 mb-6 max-w-md leading-relaxed">
                    적들이 즉시 출격합니다!<br/>무기를 획득하여 최강의 화력으로 적을 괴멸시키세요!
                </p>
                <button id="start-btn" class="px-6 py-3 bg-red-600 hover:bg-red-500 text-white text-sm md:text-base font-bold rounded-lg shadow-lg hover:shadow-red-500/50 transition-all border-2 border-red-300 active:scale-95 cursor-pointer">
                    GAME START
                </button>
            </div>
        </div>

        <!-- Mobile Touch Controls -->
        <div class="w-full mt-3 grid grid-cols-3 gap-2 md:hidden">
            <button id="btn-left" class="bg-gray-800 active:bg-blue-600 text-white py-3 rounded text-center text-xl font-bold select-none">◀</button>
            <button id="btn-fire" class="bg-red-700 active:bg-red-500 text-white py-3 rounded text-center text-sm font-bold select-none neon-text-red">FIRE 🔥</button>
            <button id="btn-right" class="bg-gray-800 active:bg-blue-600 text-white py-3 rounded text-center text-xl font-bold select-none">▶</button>
        </div>

        <!-- Instructions Footer -->
        <div class="mt-3 text-[10px] text-gray-500 text-center hidden md:block">
            [좌/우 화살표 or A/D] : 이동 | [스페이스바 / J] : 발사
        </div>
    </div>

    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playShoot(type = 'basic') {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                const now = this.ctx.currentTime;
                if (type === 'laser') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'plasma') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                }
            }

            playExplosion() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.3;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, now);
                filter.frequency.linearRampToValueAtTime(50, now + 0.3);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
            }

            playPowerup() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.25);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        const sound = new SoundEngine();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const stageEl = document.getElementById('stage');
        const highScoreEl = document.getElementById('high-score');
        const livesEl = document.getElementById('lives');
        const weaponDisplayEl = document.getElementById('weapon-display');
        const powerTimerEl = document.getElementById('power-timer');
        const timerSecEl = document.getElementById('timer-sec');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');

        let gameState = 'START'; // START, PLAYING, GAMEOVER, CLEARED
        let score = 0;
        let highScore = Number(localStorage.getItem('galagaHigh') || 5000);
        let stage = 1;
        let lives = 3;
        let lastTime = 0;

        highScoreEl.innerText = String(highScore).padStart(5, '0');

        // Canvas Responsive Setup
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const keys = { left: false, right: false, fire: false };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === ' ' || e.key === 'j' || e.key === 'J') {
                keys.fire = true;
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === ' ' || e.key === 'j' || e.key === 'J') keys.fire = false;
        });

        // Touch Control Bindings
        const setupTouchBtn = (id, keyName) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', () => { keys[keyName] = true; });
            btn.addEventListener('mouseup', () => { keys[keyName] = false; });
        };
        setupTouchBtn('btn-left', 'left');
        setupTouchBtn('btn-right', 'right');
        setupTouchBtn('btn-fire', 'fire');

        const WEAPONS = {
            1: { name: 'SINGLE CANNON', fireRate: 200, color: '#00ffff' },
            2: { name: 'DUAL LASER', fireRate: 150, color: '#00ff66' },
            3: { name: 'TRIPLE SPREAD', fireRate: 140, color: '#ffcc00' },
            4: { name: 'PLASMA WAVE', fireRate: 100, color: '#ff00ff' },
            5: { name: 'ULTRA OMNI-BEAM', fireRate: 60, color: '#ff3300' }
        };

        class Player {
            constructor() {
                this.width = 36;
                this.height = 36;
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - 60;
                this.speed = 350;
                this.weaponLevel = 1;
                this.lastShot = 0;
                this.weaponTimer = 0;
                this.invulnerable = 0;
            }

            reset() {
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - 60;
                this.weaponLevel = 1;
                this.weaponTimer = 0;
                this.invulnerable = 2; // 2 seconds safety
                powerTimerEl.classList.add('hidden');
                weaponDisplayEl.innerText = `WEAPON: ${WEAPONS[1].name}`;
            }

            update(dt) {
                if (keys.left) this.x -= this.speed * dt;
                if (keys.right) this.x += this.speed * dt;

                // Boundary Lock
                if (this.x < 10) this.x = 10;
                if (this.x > canvas.width - this.width - 10) this.x = canvas.width - this.width - 10;

                // Weapon Buff Countdown
                if (this.weaponTimer > 0) {
                    this.weaponTimer -= dt;
                    timerSecEl.innerText = Math.ceil(this.weaponTimer);
                    if (this.weaponTimer <= 0) {
                        this.weaponLevel = 1;
                        powerTimerEl.classList.add('hidden');
                        weaponDisplayEl.innerText = `WEAPON: ${WEAPONS[1].name}`;
                    }
                }

                if (this.invulnerable > 0) {
                    this.invulnerable -= dt;
                }

                // Automatic / Manual Firing
                if (keys.fire) {
                    this.shoot();
                }
            }

            shoot() {
                const now = performance.now();
                const config = WEAPONS[this.weaponLevel];
                if (now - this.lastShot >= config.fireRate) {
                    this.lastShot = now;
                    sound.playShoot(this.weaponLevel > 3 ? 'plasma' : (this.weaponLevel > 1 ? 'laser' : 'basic'));

                    const midX = this.x + this.width / 2;
                    const topY = this.y;

                    switch (this.weaponLevel) {
                        case 1:
                            bullets.push(new Bullet(midX - 2, topY, 0, -600, config.color));
                            break;
                        case 2:
                            bullets.push(new Bullet(this.x + 6, topY, 0, -650, config.color));
                            bullets.push(new Bullet(this.x + this.width - 10, topY, 0, -650, config.color));
                            break;
                        case 3:
                            bullets.push(new Bullet(midX - 2, topY, 0, -650, config.color));
                            bullets.push(new Bullet(midX - 2, topY, -150, -600, config.color));
                            bullets.push(new Bullet(midX - 2, topY, 150, -600, config.color));
                            break;
                        case 4:
                            bullets.push(new Bullet(midX - 6, topY, 0, -750, config.color, 12, 24));
                            bullets.push(new Bullet(midX - 16, topY + 5, -100, -700, config.color, 8, 18));
                            bullets.push(new Bullet(midX + 8, topY + 5, 100, -700, config.color, 8, 18));
                            break;
                        case 5:
                            for (let angle = -20; angle <= 20; angle += 10) {
                                const rad = (angle * Math.PI) / 180;
                                const vx = Math.sin(rad) * 700;
                                const vy = -Math.cos(rad) * 700;
                                bullets.push(new Bullet(midX - 4, topY, vx, vy, '#ff0055', 8, 20));
                            }
                            break;
                    }
                }
            }

            upgradeWeapon(level) {
                this.weaponLevel = Math.min(5, level);
                this.weaponTimer = 12; // 12 Seconds Ultra Weapon
                powerTimerEl.classList.remove('hidden');
                weaponDisplayEl.innerText = `WEAPON: ${WEAPONS[this.weaponLevel].name}`;
            }

            draw() {
                if (this.invulnerable > 0 && Math.floor(Date.now() / 100) % 2 === 0) return; // Blinking effect

                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

                // Ship Hull (Pixel SVG-like Drawing)
                ctx.fillStyle = '#00f0ff';
                ctx.beginPath();
                ctx.moveTo(0, -18);
                ctx.lineTo(14, 14);
                ctx.lineTo(6, 10);
                ctx.lineTo(0, 14);
                ctx.lineTo(-6, 10);
                ctx.lineTo(-14, 14);
                ctx.closePath();
                ctx.fill();

                // Cockpit & Wings
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(-3, -6, 6, 10);
                ctx.fillStyle = '#ffee00';
                ctx.fillRect(-12, 6, 4, 8);
                ctx.fillRect(8, 6, 4, 8);

                // Engine Flame
                ctx.fillStyle = Math.random() > 0.5 ? '#ff9900' : '#ffff00';
                ctx.beginPath();
                ctx.moveTo(-4, 14);
                ctx.lineTo(0, 22 + Math.random() * 4);
                ctx.lineTo(4, 14);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, vx, vy, color = '#ffff00', width = 5, height = 14) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.width = width;
                this.height = height;
                this.active = true;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;

                if (this.y < -20 || this.y > canvas.height + 20 || this.x < -20 || this.x > canvas.width + 20) {
                    this.active = false;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }
        }

        class Enemy {
            constructor(gridX, gridY, type) {
                this.gridX = gridX;
                this.gridY = gridY;
                this.type = type; // 1: Bee, 2: Butterfly, 3: Boss

                this.width = 28;
                this.height = 28;

                this.homeX = 0;
                this.homeY = 0;

                this.x = canvas.width / 2;
                this.y = -40;
                this.vx = 0;
                this.vy = 0;

                this.state = 'ENTERING';
                this.swoopTimer = 0;
                this.swoopAngle = 0;
                this.active = true;

                this.hp = type === 3 ? 3 : 1;
                this.maxHp = this.hp;

                this.entryProgress = 0;
                this.entrySpeed = 0.8 + Math.random() * 0.4;
                this.spawnSide = Math.random() > 0.5 ? 1 : -1;
            }

            calculateHomePosition() {
                const cols = 10;
                const spacingX = Math.min(42, (canvas.width - 60) / cols);
                const spacingY = 32;
                const startX = (canvas.width - (cols * spacingX)) / 2 + spacingX / 2;
                const startY = 70;

                this.homeX = startX + this.gridX * spacingX - this.width / 2;
                this.homeY = startY + this.gridY * spacingY;
            }

            update(dt, playerX, playerY) {
                this.calculateHomePosition();

                if (this.state === 'ENTERING') {
                    this.entryProgress += dt * this.entrySpeed;
                    const t = Math.min(this.entryProgress, 1);

                    const startX = canvas.width / 2 + (this.spawnSide * canvas.width * 0.4);
                    const startY = -40;
                    const controlX = canvas.width / 2 - (this.spawnSide * canvas.width * 0.3);
                    const controlY = canvas.height * 0.4;

                    this.x = (1 - t) * (1 - t) * startX + 2 * (1 - t) * t * controlX + t * t * this.homeX;
                    this.y = (1 - t) * (1 - t) * startY + 2 * (1 - t) * t * controlY + t * t * this.homeY;

                    if (t >= 1) {
                        this.state = 'GRID';
                        this.x = this.homeX;
                        this.y = this.homeY;
                    }
                } else if (this.state === 'GRID') {
                    const sway = Math.sin(Date.now() * 0.003) * 15;
                    this.x = this.homeX + sway;
                    this.y = this.homeY;

                    if (Math.random() < 0.0008 * stage) {
                        this.state = 'SWOOPING';
                        this.swoopTimer = 0;
                        this.swoopStartX = this.x;
                        this.swoopStartY = this.y;
                    }
                } else if (this.state === 'SWOOPING') {
                    this.swoopTimer += dt * 1.8;
                    const t = this.swoopTimer;

                    this.y += (200 + stage * 20) * dt;
                    this.x += Math.sin(t * 4) * 120 * dt;

                    if (Math.random() < 0.02) {
                        enemyBullets.push(new Bullet(this.x + this.width / 2, this.y + this.height, 0, 300, '#ff0000', 4, 10));
                    }

                    if (this.y > canvas.height + 30) {
                        this.y = -30;
                        this.state = 'RETURNING';
                    }
                } else if (this.state === 'RETURNING') {
                    const dx = this.homeX - this.x;
                    const dy = this.homeY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 10) {
                        this.state = 'GRID';
                    } else {
                        this.x += (dx / dist) * 200 * dt;
                        this.y += (dy / dist) * 200 * dt;
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

                const wingFlap = Math.sin(Date.now() * 0.01) * 0.2;

                if (this.type === 1) { // Bee
                    ctx.fillStyle = '#ffff00';
                    ctx.fillRect(-8, -8, 16, 16);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(-10, -4, 20, 4);
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(-14, -10 + wingFlap * 10, 5, 12);
                    ctx.fillRect(9, -10 + wingFlap * 10, 5, 12);
                } else if (this.type === 2) { // Butterfly
                    ctx.fillStyle = '#00aaff';
                    ctx.beginPath();
                    ctx.arc(0, 0, 9, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff0055';
                    ctx.fillRect(-12, -8, 6, 14);
                    ctx.fillRect(6, -8, 6, 14);
                } else if (this.type === 3) { // Boss Alien
                    ctx.fillStyle = this.hp < this.maxHp ? '#ff6600' : '#00ff66';
                    ctx.fillRect(-10, -10, 20, 20);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(-6, -4, 4, 6);
                    ctx.fillRect(2, -4, 4, 6);
                    // Horns/Antennae
                    ctx.fillStyle = '#ffee00';
                    ctx.fillRect(-10, -14, 4, 4);
                    ctx.fillRect(6, -14, 4, 4);
                }

                ctx.restore();
            }
        }

        class PowerUp {
            constructor(x, y, level) {
                this.x = x;
                this.y = y;
                this.level = level;
                this.width = 22;
                this.height = 22;
                this.vy = 120;
                this.active = true;
            }

            update(dt) {
                this.y += this.vy * dt;
                if (this.y > canvas.height + 30) this.active = false;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.fillStyle = WEAPONS[this.level].color;
                ctx.shadowColor = WEAPONS[this.level].color;
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.arc(0, 0, 11, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.font = '10px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('P' + this.level, 0, 1);

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 300;
                this.vy = (Math.random() - 0.5) * 300;
                this.size = Math.random() * 4 + 2;
                this.alpha = 1;
                this.active = true;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.alpha -= dt * 2.5;
                if (this.alpha <= 0) this.active = false;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        let player = new Player();
        let enemies = [];
        let bullets = [];
        let enemyBullets = [];
        let powerUps = [];
        let particles = [];

        function spawnEnemyWave() {
            enemies = [];
            const rows = 4;
            const cols = 10;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let type = 1; // Default Bee
                    if (r === 0) type = 3; // Boss
                    else if (r === 1) type = 2; // Butterfly

                    const enemy = new Enemy(c, r, type);
                    enemies.push(enemy);
                }
            }
        }

        function createExplosion(x, y, color = '#ff5500', count = 15) {
            sound.playExplosion();
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function updateHighScore() {
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('galagaHigh', String(highScore));
                highScoreEl.innerText = String(highScore).padStart(5, '0');
            }
        }

        function checkCollisions() {
            // Player Bullets vs Enemies
            bullets.forEach(b => {
                if (!b.active) return;
                enemies.forEach(e => {
                    if (!e.active) return;
                    if (b.x < e.x + e.width && b.x + b.width > e.x &&
                        b.y < e.y + e.height && b.y + b.height > e.y) {

                        b.active = false;
                        e.hp--;

                        if (e.hp <= 0) {
                            e.active = false;
                            score += e.type * 100;
                            scoreEl.innerText = String(score).padStart(5, '0');
                            updateHighScore();
                            createExplosion(e.x + e.width / 2, e.y + e.height / 2, e.type === 3 ? '#00ff66' : '#ff9900');

                            // Power-up Drop Chance (25%)
                            if (Math.random() < 0.25) {
                                const nextLvl = Math.min(5, player.weaponLevel + 1);
                                powerUps.push(new PowerUp(e.x, e.y, nextLvl));
                            }
                        } else {
                            createExplosion(e.x + e.width / 2, e.y + e.height / 2, '#ffffff', 5);
                        }
                    }
                });
            });

            // Enemy Bullets / Enemy Collision vs Player
            if (player.invulnerable <= 0) {
                enemyBullets.forEach(eb => {
                    if (!eb.active) return;
                    if (eb.x < player.x + player.width && eb.x + eb.width > player.x &&
                        eb.y < player.y + player.height && eb.y + eb.height > player.y) {

                        eb.active = false;
                        hitPlayer();
                    }
                });

                enemies.forEach(e => {
                    if (!e.active) return;
                    if (e.x < player.x + player.width && e.x + e.width > player.x &&
                        e.y < player.y + player.height && e.y + e.height > player.y) {

                        e.active = false;
                        createExplosion(e.x + e.width / 2, e.y + e.height / 2, '#ff0000');
                        hitPlayer();
                    }
                });
            }

            // Power-ups Collection
            powerUps.forEach(p => {
                if (!p.active) return;
                if (p.x < player.x + player.width && p.x + p.width > player.x &&
                    p.y < player.y + player.height && p.y + p.height > player.y) {

                    p.active = false;
                    sound.playPowerup();
                    player.upgradeWeapon(p.level);
                    score += 200;
                    scoreEl.innerText = String(score).padStart(5, '0');
                    updateHighScore();
                }
            });
        }

        function hitPlayer() {
            lives--;
            livesEl.innerText = '❤️'.repeat(Math.max(0, lives));
            createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#00f0ff', 25);

            if (lives <= 0) {
                gameState = 'GAMEOVER';
                overlayTitle.innerText = "GAME OVER";
                overlayTitle.className = "text-2xl md:text-4xl text-red-600 neon-text-red mb-4 animate-bounce";
                overlayMsg.innerText = `최종 점수: ${score}점\n격파한 적들로 지구가 보호되었습니다!`;
                startBtn.innerText = "RETRY GAME";
                overlay.classList.remove('hidden');
            } else {
                player.reset();
            }
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap max frame delta
            lastTime = timestamp;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Stars / Background Effect
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 30; i++) {
                const sx = (Math.sin(i * 99 + timestamp * 0.001) * 0.5 + 0.5) * canvas.width;
                const sy = ((i * 30 + timestamp * 0.05) % canvas.height);
                ctx.fillRect(sx, sy, (i % 3 === 0) ? 2 : 1, (i % 3 === 0) ? 2 : 1);
            }

            if (gameState === 'PLAYING') {
                player.update(dt);
                player.draw();

                bullets.forEach(b => { b.update(dt); b.draw(); });
                bullets = bullets.filter(b => b.active);

                enemyBullets.forEach(eb => { eb.update(dt); eb.draw(); });
                enemyBullets = enemyBullets.filter(eb => eb.active);

                enemies.forEach(e => { e.update(dt, player.x, player.y); e.draw(); });
                enemies = enemies.filter(e => e.active);

                powerUps.forEach(p => { p.update(dt); p.draw(); });
                powerUps = powerUps.filter(p => p.active);

                particles.forEach(p => { p.update(dt); p.draw(); });
                particles = particles.filter(p => p.active);

                checkCollisions();

                if (enemies.length === 0) {
                    stage++;
                    stageEl.innerText = stage;
                    spawnEnemyWave();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            sound.init();
            score = 0;
            lives = 3;
            stage = 1;

            scoreEl.innerText = "00000";
            stageEl.innerText = "1";
            livesEl.innerText = "❤️❤️❤️";

            player.reset();
            bullets = [];
            enemyBullets = [];
            powerUps = [];
            particles = [];

            spawnEnemyWave(); // IMMEDIATELY SPAWN ENEMIES

            gameState = 'PLAYING';
            overlay.classList.add('hidden');
        }

        startBtn.addEventListener('click', startGame);

        // Start animation loop on window load
        window.onload = () => {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
